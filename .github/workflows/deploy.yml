name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # NOTE: these are the PUBLIC publishable Supabase values (safe by design, RLS protects data)
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://iwrxgtcvcedylitkmdhr.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_UX5R05Uhk8IyC2JNTu7faw_EV8w__M8
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
