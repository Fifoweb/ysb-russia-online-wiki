<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>РО | ГИБДД | УСБ — Wiki</title>
    <script>
      // SPA route restore: 404.html parked the requested path in sessionStorage
      (function () {
        var p = sessionStorage.getItem('spa-path');
        if (p) {
          sessionStorage.removeItem('spa-path');
          var base = '/ysb-russia-online-wiki';
          window.history.replaceState(null, '', (window.location.pathname.indexOf(base) === 0 ? base : '') + p);
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
